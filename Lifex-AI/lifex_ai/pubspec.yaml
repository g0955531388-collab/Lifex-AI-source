name: lifex_ai
description: "Lifex-AI Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  path_provider: ^2.1.0
  image_picker: ^1.1.0
  provider: ^6.1.0
  shared_preferences: ^2.2.3
  camera: ^0.10.6
  permission_handler: ^11.3.1
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/lifex_seal.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/branding/lifex_seal.jpg
    - lib/data/medical/
    - lib/data/reference/
    - lib/data/reference/drugs/
