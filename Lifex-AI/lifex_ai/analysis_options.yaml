include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true

analyzer:
  exclude:
    - "build/**"
    - ".dart_tool/**"
    - "**/*.g.dart"
    - "lib/l10n/generated/**"
    # Unwired drafts outside lib/: they need web_socket_channel and a safety review before use.
    - "drafts/**"
