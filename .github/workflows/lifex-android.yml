name: Lifex-AI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lifex-AI/lifex_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-apk:
    name: Build debug APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lifex-AI/lifex_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: lifex-ai-debug-apk
          path: Lifex-AI/lifex_ai/build/app/outputs/flutter-apk/app-debug.apk

  build-release-apk:
    name: Build release APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lifex-AI/lifex_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true
      - run: flutter pub get
      # Uses debug signingConfig for release in app/build.gradle.kts until production keystore is configured.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lifex-ai-release-apk
          path: Lifex-AI/lifex_ai/build/app/outputs/flutter-apk/app-release.apk
