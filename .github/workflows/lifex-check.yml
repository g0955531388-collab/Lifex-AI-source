name: Lifex check

on:
  push:
  pull_request:

jobs:
  test:
    name: Test, analyze, and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lifex-AI/lifex_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
